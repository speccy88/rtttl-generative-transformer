[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtttl-generative-transformer"
version = "0.1.0"
description = "Educational event-level RTTTL language models"
requires-python = ">=3.10,<3.14"

[project.optional-dependencies]
naming = ["transformers==4.57.6", "safetensors>=0.4.3,<1"]
release = ["safetensors==0.8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
