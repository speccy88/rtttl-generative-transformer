# Apple Silicon fine-tuning. Use --init-checkpoint with the existing checkpoint.
# Three epochs, full train/validation splits; all neural computation runs on MPS.
seed: 42
deterministic: true
output_root: runs_mps
data:
  processed_dir: data/processed
  augment_semitones: 2
model:
  type: transformer
  context_length: 256
  d_model: 192
  n_layers: 4
  n_heads: 6
  dropout: 0.1
training:
  device: mps
  mixed_precision: "off"  # float32 on MPS
  batch_size: 16
  gradient_accumulation_steps: 2
  epochs: 3
  learning_rate: 0.00003
  weight_decay: 0.01
  warmup_steps: 10
  min_lr_ratio: 0.1
  gradient_clip: 1.0
  eval_every_steps: 0
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001
  sample_every_evaluations: 1
  num_workers: 0
  cpu_threads: 4
  tensorboard: false
samples:
  count: 2
  min_events: 16
  max_events: 64
  temperature: 0.8
  top_k: 20
