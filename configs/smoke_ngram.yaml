seed: 42
deterministic: true
output_root: runs
data:
  processed_dir: data/smoke
  augment_semitones: 0
  context_length: 64
model:
  type: ngram
  order: 5
  alpha: 0.1
training:
  device: cpu
  mixed_precision: false
  batch_size: 8
  gradient_accumulation_steps: 1
  epochs: 10
  max_steps: 24
  learning_rate: 0.001
  weight_decay: 0.01
  warmup_steps: 2
  min_lr_ratio: 0.1
  gradient_clip: 1.0
  eval_every_steps: 12
  early_stopping_patience: 20
  sample_every_evaluations: 1
  num_workers: 0
  cpu_threads: 2
  tensorboard: false
samples:
  count: 2
  min_events: 8
  max_events: 24
  temperature: 0.8
  top_k: 20
